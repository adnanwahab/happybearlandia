name: Mobile Canvas fallback measurements
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/e2e/low-end-fallback.e2e.js'
      - 'test/low-end-fallback.browser.config.js'
      - 'world/future-machine/**'
      - '.github/workflows/low-end-fallback.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HBL_LOW_END_ARTIFACT_DIR: test-results/low-end-fallback
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify fallback contracts
        run: bun test test/future-machine-canvas.test.js test/future-machine-backend.test.js test/future-machine-scrub-identity.test.js
      - name: Measure emulated mobile interactions (not physical hardware)
        run: bunx playwright test --config test/low-end-fallback.browser.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-canvas-fallback-measurements
          path: test-results/low-end-fallback
          if-no-files-found: error
