name: Symphony throughput regression
on:
  pull_request:
    paths:
      - 'tools/symphony/local/**'
      - '.github/workflows/symphony-throughput.yml'
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -W error::ResourceWarning -m unittest discover -s tools/symphony/local -p 'test_*.py'
