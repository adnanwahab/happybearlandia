name: HappyBearLandia core journeys

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify simulation, causal storage, and navigation contracts
        run: >
          bun test --timeout 60000
          test/universe-shell.test.js
          test/html-navigation.test.js
          test/local-journeys.test.js
          test/causality-contracts.test.js
          test/causal-storage.test.js
          test/causality-read.test.js
          test/time-machine-checkpoints.test.js
          test/checkpoint-replay.test.js
          test/world-causal-adapter.test.js
          test/bakery-journey.test.js
          test/bakery-scenario.test.js
          test/living-city-recipe.test.js
          test/living-city-network.test.js
          test/living-city-quests.test.js
          test/living-city-council.test.js
          test/decision-storage.test.js
          test/release-health.test.js
          test/server.test.js
          test/world-database-path.test.js
          test/overpass-diagnostics.test.js
      - name: Install Chromium for browser journeys
        run: bunx playwright install --with-deps chromium
      - name: Universe shell, sprint experiences, and saved future journey
        run: bunx playwright test --config test/release-browser.config.js
      - name: Time Machine recording and playback with a fresh store
        run: bunx playwright test --config test/time-machine.browser.config.js world-time-machine.browser.js --workers=1
      - name: Causal inspector component
        run: bunx playwright test --config test/causality.browser.config.js
