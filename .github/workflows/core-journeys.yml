name: HappyBearLandia core journeys

# Fast required gate. The full browser/replay suite runs in post-merge-observations.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Essential security, replay, navigation and civic regressions
        run: >
          bun test --timeout 60000
          test/universe-shell.test.js
          test/html-navigation.test.js
          test/causality-contracts.test.js
          test/future-machine-boundaries.test.js
          test/city-replay-golden.test.js
          test/patch-voting.test.js
          test/patch-queue.test.js
          test/run-input-security.test.js
          test/server.test.js
          test/release-health.test.js
      - name: Verify guarded auto-merge policy
        run: node --test test/auto-merge.test.cjs
