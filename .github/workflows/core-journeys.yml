name: HappyBearLandia core journeys

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  civilization-storm:
    # Observe these suites before deciding on gating in a follow-up issue.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Storm model contracts (observational)
        id: storm
        continue-on-error: true
        timeout-minutes: 5
        run: bun test test/storm-*.test.js
      - name: Install Chromium for civilization journeys
        run: bunx playwright install --with-deps chromium
      - name: Civilization browser journeys (observational)
        id: civilization
        continue-on-error: true
        timeout-minutes: 12
        run: bunx playwright test --config test/civilization.browser.config.js
      - name: Record observational suite outcomes
        if: always()
        env:
          STORM_OUTCOME: ${{ steps.storm.outcome }}
          CIVILIZATION_OUTCOME: ${{ steps.civilization.outcome }}
        run: |
          {
            echo '### Civilization and storm observation (SHE-242)'
            echo "- Storm Bun suite: ${STORM_OUTCOME}"
            echo "- Civilization browser suite: ${CIVILIZATION_OUTCOME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo 'These suites are non-blocking pending a follow-up gating decision.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain civilization browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civilization-browser-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  verify:
    # Keep browser dependencies on an explicit Playwright-supported Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify simulation, causal storage, and navigation contracts
        run: >
          bun test --timeout 60000
          test/universe-shell.test.js
          test/html-navigation.test.js
          test/local-journeys.test.js
          test/causality-contracts.test.js
          test/causal-storage.test.js
          test/causality-read.test.js
          test/time-machine-checkpoints.test.js
          test/checkpoint-replay.test.js
          test/world-causal-adapter.test.js
          test/bakery-journey.test.js
          test/bakery-scenario.test.js
          test/living-city-recipe.test.js
          test/living-city-network.test.js
          test/living-city-quests.test.js
          test/living-city-council.test.js
          test/decision-storage.test.js
          test/release-health.test.js
          test/server.test.js
          test/patch-voting.test.js
          test/patch-queue.test.js
          test/patch-voting-server.test.js
          test/world-database-path.test.js
          test/overpass-diagnostics.test.js
      - name: Verify finite agent-count exports and transition evidence
        run: bun test test/agent-counts.test.js test/million-release.test.js test/population-memory-pressure.test.js
      - name: Verify manifest preflight and replay cancellation regressions
        run: >
          bun test --timeout 15000
          test/city-worker-call.test.js
          test/city-systems.test.js
          test/project-unblock.test.js
          test/server-civic-api.test.js
          test/future-machine-manifest-validation.test.js
          test/future-machine-data.test.js
          test/future-machine-boundaries.test.js
          test/future-machine-share.test.js
          test/future-machine-diff.test.js
          test/example-receipts.test.js
      - name: Install browser engines for canonical journeys
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Universe shell, sprint experiences, and saved future journey
        run: bunx playwright test --config test/release-browser.config.js
      - name: Flagship canonical journey across Chromium, Firefox and WebKit
        run: bunx playwright test --config test/flagship-browser.config.js
      - name: Time Machine recording and playback with a fresh store
        run: bunx playwright test --config test/time-machine.browser.config.js world-time-machine.browser.js --workers=1
      - name: Causal inspector component
        run: bunx playwright test --config test/causality.browser.config.js
      - name: Verify normal replay and visible manifest rejection
        env:
          HBL_SYMPHONY_UNBLOCK_ARTIFACT_DIR: ${{ github.workspace }}/test-results/symphony-unblock
        run: bunx playwright test --config test/symphony-unblock.browser.config.js
      - name: Retain manifest validation and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symphony-unblock-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
