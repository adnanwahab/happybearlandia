
name: Performance budgets

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  performance:
    name: Performance - ${{ matrix.scene }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scene:
          - aerial-city
          - downtown
          - construction
          - rush-hour
          - night
          - rain

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run test:performance

      - run: bunx playwright install --with-deps chromium

      - name: Measure routes and enforce budgets
        env:
          HBL_PERF_BACKENDS: webgpu
          HBL_PERF_SCENE: ${{ matrix.scene }}
        run: |
          PORT=3198 bun run server.js > /tmp/hbl-performance-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3198/world?demo=1 > /dev/null; then
              break
            fi
            sleep 1
          done

          bun run profile:performance

      - name: Retain measurements and CPU profiles even on budget failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-profiles-${{ matrix.scene }}
          path: test-results/performance
          if-no-files-found: error
          retention-days: 14
