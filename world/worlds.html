<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>All Possible Worlds</title>
<style>
  :root { --bg: #f4f1ea; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a64; --line: rgba(0,0,0,.12); --accent: #2f6fd6; --good: #2e8b57; --bad: #c4492a; --mixed: #b9b6ad; --tile-bg: #e7e3d9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15161a; --panel: #1d1e23; --ink: #ecebe6; --muted: #9a9993; --line: rgba(255,255,255,.14); --accent: #79a8ff; --good: #5cc28a; --bad: #ef7b5c; --mixed: #6c6b66; --tile-bg: #24252b; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  h1 { font-size: 18px; margin: 0; line-height: 1.25; }
  .grow { flex: 1; min-width: 220px; }
  label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  select, button, .btn { font: inherit; font-size: 13px; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; text-decoration: none; }
  .btn { color: var(--accent); border-color: var(--accent); }
  main { max-width: 1400px; margin: 0 auto; padding: 14px 16px 64px; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .tile.improved { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
  .tile.worse { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
  .tile-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; }
  .tile-head b { font-variant-numeric: tabular-nums; }
  .tile-head .grow { min-width: 0; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.improved { color: var(--good); border-color: var(--good); }
  .pill.worse { color: var(--bad); border-color: var(--bad); }
  .tile-head a { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .screen { position: relative; aspect-ratio: 4 / 3; background: var(--tile-bg); }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .screen .idle { position: absolute; inset: 0; display: grid; place-items: center; gap: 6px; text-align: center; color: var(--muted); font-size: 12px; padding: 10px; }
  .screen .idle button { color: var(--accent); border-color: var(--accent); }
  .live { position: absolute; left: 8px; bottom: 8px; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); font-variant-numeric: tabular-nums; pointer-events: none; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="grow">
      <div class="kicker">HappyBearLandia · all possible worlds</div>
      <h1 id="title">Loading…</h1>
    </div>
    <label>Show
      <select id="filter">
        <option value="all">All realities</option>
        <option value="improved">Improved</option>
        <option value="mixed">Mixed</option>
        <option value="worse">Worse</option>
      </select>
    </label>
    <label>Order
      <select id="order">
        <option value="index">Reality number</option>
        <option value="best">Best first</option>
        <option value="worst">Worst first</option>
      </select>
    </label>
    <label>Live at once
      <select id="live">
        <option>4</option><option selected>6</option><option>9</option><option>12</option>
      </select>
    </label>
    <a class="btn" id="back">← Results</a>
  </div>
</header>
<main>
  <p class="note" id="note"></p>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const params = new URLSearchParams(location.search);

const snapshotId = params.get("simulation");
const runs = Math.max(1, Math.min(1000, Math.floor(Number(params.get("runs")) || 100)));
const years = Math.max(1, Math.min(10, Math.floor(Number(params.get("years")) || 10)));
const people = Math.max(20, Math.min(300, Math.floor(Number(params.get("people")) || 60)));
const baseSeed = params.get("seed");
// Each live world is a full 3D scene; browsers allow ~16 WebGL contexts per page, and
// laptops struggle well before that. Off-screen worlds are unloaded to stay under the cap.
let maxLive = Number(params.get("live")) || 12;
$("live").value = String(maxLive);

$("back").href = `/world/realities.html?${new URLSearchParams({ simulation: snapshotId || "", runs: String(runs), years: String(years), seed: baseSeed || "", people: String(people) })}`;

if (!snapshotId || !baseSeed) {
  $("title").textContent = "Missing simulation";
  $("note").innerHTML = 'Open this from a realities page ("View all as live worlds"), or add <code>?simulation=…&amp;seed=…</code>.';
  throw new Error("missing params");
}

let snapshot = null;
try {
  const res = await fetch(`/api/dear-congress/simulation-snapshots/${encodeURIComponent(snapshotId)}`, { signal: AbortSignal.timeout(10000) });
  snapshot = (await res.json())?.snapshot || null;
} catch { /* title falls back below */ }
const origin = snapshot?.location || { lat: 29.7286, lng: -95.4746 };
$("title").textContent = snapshot
  ? `${snapshot.plan.label} plan · ${runs.toLocaleString()} possible worlds`
  : `${runs.toLocaleString()} possible worlds`;

// Verdicts from the realities page, if it finished in this browser.
let verdicts = null;
try {
  const raw = localStorage.getItem(`hbl:realities:${snapshotId}:${baseSeed}:${years}:${people}`);
  const parsed = raw ? JSON.parse(raw) : null;
  if (parsed?.realities?.length) verdicts = new Map(parsed.realities.map((r) => [r.index, r]));
} catch { verdicts = null; }

if (!verdicts) {
  for (const id of ["filter", "order"]) $(id).disabled = true;
  $("note").innerHTML = `Each tile is one reality at year ${years}, running live with the plan. Finish the run on the <a href="${esc($("back").href)}">results page</a> in this browser to label and sort them by outcome.`;
} else {
  $("note").textContent = `Each tile is one reality at year ${years}, running live with the plan, labeled by its simulated outcome. Scroll to bring worlds to life. Up to ${maxLive} run at once (change it above); the rest wait, and off-screen ones pause.`;
}

function worldUrl(index) {
  const q = new URLSearchParams({
    lat: String(origin.lat), lng: String(origin.lng), people: String(people),
    simulation: snapshotId, reality: String(index), seed: baseSeed, year: String(years),
  });
  return `/world?${q}`;
}

/* ------------------------------------------------------------------ */
/* Tiles                                                               */
/* ------------------------------------------------------------------ */
const tiles = new Map(); // index → { el, screen, iframe, visible, lastSeen, status }
for (let i = 0; i < runs; i++) {
  const v = verdicts?.get(i);
  const el = document.createElement("article");
  el.className = `tile ${v?.verdict || ""}`;
  el.dataset.index = String(i);
  el.innerHTML = `
    <div class="tile-head">
      <b>#${i}</b>
      <span class="grow">${v ? `<span class="pill ${v.verdict}">${v.verdict} · ${v.score > 0 ? "+" : ""}${(v.score * 100).toFixed(1)}%</span>` : ""}</span>
      <a href="${esc(worldUrl(i))}" target="_blank" rel="noopener">Open ↗</a>
    </div>
    <div class="screen"><div class="idle"><span>Not running</span><button type="button">Run here</button></div></div>`;
  const screen = el.querySelector(".screen");
  const t = { el, screen, iframe: null, visible: false, lastSeen: 0, pinnedAt: 0, status: "" };
  screen.querySelector("button").onclick = () => { t.pinnedAt = performance.now(); schedule(); };
  tiles.set(i, t);
}

function arrange() {
  const filter = $("filter").value, order = $("order").value;
  let list = [...tiles.keys()];
  if (verdicts && filter !== "all") list = list.filter((i) => verdicts.get(i)?.verdict === filter);
  if (verdicts && order !== "index") {
    const score = (i) => verdicts.get(i)?.score ?? 0;
    list.sort((a, b) => (order === "best" ? score(b) - score(a) : score(a) - score(b)) || a - b);
  }
  const grid = $("grid");
  grid.replaceChildren(...list.map((i) => tiles.get(i).el));
  for (const [i, t] of tiles) if (!t.el.isConnected) { t.visible = false; unload(t); }
  schedule();
}

function load(i, t) {
  if (t.iframe) return;
  const f = document.createElement("iframe");
  f.title = `Reality #${i}`;
  f.loading = "eager";
  f.src = `${worldUrl(i)}&embed=1&speed=60`;
  t.screen.querySelector(".idle").hidden = true;
  const live = document.createElement("div");
  live.className = "live";
  live.textContent = "Starting…";
  t.screen.append(f, live);
  t.iframe = f;
  t.liveEl = live;
}

function unload(t) {
  if (!t.iframe) return;
  t.iframe.remove();
  t.liveEl?.remove();
  t.iframe = null;
  t.liveEl = null;
  const idle = t.screen.querySelector(".idle");
  idle.hidden = false;
  idle.querySelector("span").textContent = t.status ? `Paused at ${t.status}` : "Not running";
}

// Keep at most maxLive worlds running: visible ones first (top of the screen first),
// plus any the person asked to run, most recent first.
function schedule() {
  const want = [...tiles.entries()]
    .filter(([, t]) => t.el.isConnected && (t.visible || t.pinnedAt))
    .sort(([, a], [, b]) => (b.pinnedAt - a.pinnedAt) || (Number(b.visible) - Number(a.visible)) || (a.el.offsetTop - b.el.offsetTop) || (a.el.offsetLeft - b.el.offsetLeft))
    .slice(0, maxLive)
    .map(([i]) => i);
  const keep = new Set(want);
  for (const [i, t] of tiles) if (!keep.has(i)) { unload(t); if (!t.visible) t.pinnedAt = 0; }
  for (const i of want) load(i, tiles.get(i));
}

let pending = null;
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const t = tiles.get(Number(e.target.dataset.index));
    if (t) t.visible = e.isIntersecting;
  }
  clearTimeout(pending);
  pending = setTimeout(schedule, 150); // don't spin up worlds while flinging past them
}, { rootMargin: "100px 0px" });
for (const t of tiles.values()) io.observe(t.el);

// Live clock + mood from each embedded world.
addEventListener("message", (ev) => {
  if (ev.origin !== location.origin || ev.data?.type !== "hbl-world") return;
  const t = tiles.get(ev.data.reality);
  if (!t) return;
  t.status = `${ev.data.clock} · mood ${Math.round(ev.data.mood)}`;
  if (t.liveEl) t.liveEl.textContent = t.status;
});

$("filter").onchange = arrange;
$("order").onchange = arrange;
$("live").onchange = () => { maxLive = Number($("live").value); schedule(); };
arrange();
</script>
</body>
</html>
