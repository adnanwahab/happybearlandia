<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a household · HappyBearLandia</title><link rel="stylesheet" href="/world/house/creator.css"></head><body><main><a href="/world/house">← Saved households</a><h1>Create your household</h1><p>Create a new saved simulation with 1–6 people. Your current city and household stay saved separately. A supplied house keeps its mapped exterior; interior rooms remain inferred.</p><form id="creator"><section class="household-fields"><label>Household name<input name="householdName" value="My household" maxlength="60" required></label><label>Starting savings ($)<input name="money" type="number" min="0" max="1000000" value="14250" required></label><label>Relationship<select name="relationship"><option value="family">Family</option><option value="roommates">Roommates</option><option value="couple">Couple (two adults)</option></select></label></section><div id="members"></div><button type="button" id="add-member">＋ Add person</button><footer><p id="status" role="status"></p><button type="submit" id="create">Create & enter household</button></footer></form></main><script type="module" src="/world/house/creator.js"></script></body></html>
