<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HappyBearLandia world</title>
<style>
  :root { --bg: #f4f1ea; --panel: rgba(255,255,255,.92); --ink: #1d1d1b; --muted: #6b6a64; --line: rgba(0,0,0,.12); --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15161a; --panel: rgba(24,25,30,.92); --ink: #ecebe6; --muted: #9a9993; --line: rgba(255,255,255,.14); --accent: #79a8ff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; width: 300px; max-width: calc(100vw - 48px); }
  #feed { bottom: 12px; left: 12px; width: 300px; max-width: calc(100vw - 48px); max-height: 32vh; overflow: auto; }
  #inspect { top: 12px; right: 12px; width: 260px; display: none; }
  #experimentPanel { right: 12px; bottom: 12px; width: min(520px, calc(100vw - 48px)); max-height: 40vh; overflow: auto; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  button, select { padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #clock { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .need { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .need span { width: 52px; color: var(--muted); }
  #feed div { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; }
  #feed div:last-child { border: 0; }
  #feed b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 6px; }
  #tag { position: fixed; pointer-events: none; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: none; transform: translate(-50%, -140%); white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .warn { margin-top: 8px; padding: 8px 10px; border: 1px solid color-mix(in srgb, #d2552d 55%, var(--line)); border-radius: 8px; background: color-mix(in srgb, #d2552d 12%, transparent); color: color-mix(in srgb, #d2552d 70%, var(--ink)); font-size: 12px; }
  #netdiagDetails { margin-top: 6px; }
  #netdiagDetails summary { cursor: pointer; }
  #netdiagErrors { margin-top: 6px; white-space: pre-wrap; line-height: 1.35; }
  .exp-grid { display: grid; gap: 10px; margin-top: 8px; }
  .exp-chart { border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .exp-chart h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .exp-seed { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .exp-seed code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 85%, transparent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-seed input { min-width: 160px; max-width: 240px; padding: 3px 7px; font-size: 11px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  .exp-seed button { padding: 3px 7px; font-size: 11px; }
  .exp-seed button.icon { min-width: 26px; padding: 3px 6px; }
  .exp-compare { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .exp-footnote { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .exp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .exp-table td, .exp-table th { border-top: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  #demoBar { top: 12px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 680px)); min-width: 300px; z-index: 5; }
  #demoCaption { font-size: 16px; line-height: 1.4; margin-top: 2px; }
  #demoStep { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #demoBtn { border-color: var(--accent); color: var(--accent); }
  #cyclePanel { right: 12px; bottom: 12px; width: min(380px, calc(100vw - 48px)); max-height: 56vh; overflow: auto; }
  .cy-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .cy-big div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .cy-big b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .cy-big .win { border-color: var(--accent); }
  .cy-tabs { display: flex; gap: 4px; margin: 6px 0; }
  .cy-tabs button { flex: 1; font-size: 12px; }
  .cy-fric { display: grid; grid-template-columns: 74px 1fr 1fr; gap: 4px 8px; font-size: 12px; align-items: center; }
  .cy-fric .h { color: var(--muted); font-size: 11px; }
  .cy-who { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .cy-who blockquote { margin: 4px 0 6px; padding-left: 8px; border-left: 2px solid var(--line); font-size: 12px; }
  .cy-who .lbl { font-size: 11px; color: var(--muted); }
  .cy-scale { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #d2463c, #d2be3c, #3cbe50); margin: 4px 0 2px; }
  @media (max-width: 640px) { #inspect { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; } #feed { display: none; } #experimentPanel { left: 12px; right: 12px; width: auto; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div id="loading">Generating your neighborhood…</div>
<div id="tag"></div>

<div class="panel" id="top">
  <h1>HappyBearLandia · world</h1>
  <form class="row" id="goto">
    <input type="text" id="latlng" placeholder="29.7286, -95.4746" aria-label="Latitude, longitude" />
    <button>Go</button>
  </form>
  <div class="row">
    <select id="preset" aria-label="Places">
      <option value="">Jump to…</option>
      <option value="29.7286,-95.4746">Gulfton, Houston</option>
      <option value="29.7520,-95.3580">Downtown Houston</option>
      <option value="29.7858,-95.8245">Katy, TX</option>
      <option value="40.7265,-73.9815">East Village, NYC</option>
      <option value="35.6595,139.7005">Shibuya, Tokyo</option>
      <option value="51.5390,-0.1426">Camden, London</option>
      <option value="6.4541,3.3947">Lagos Island</option>
    </select>
    <button id="here" type="button">My location</button>
  </div>
  <div class="row" style="justify-content: space-between">
    <div id="clock">—</div>
    <div class="row" id="speeds" style="margin:0">
      <button data-s="0" aria-label="Pause">❚❚</button><button data-s="1">1×</button><button data-s="10" class="on">10×</button><button data-s="60">60×</button>
    </div>
  </div>
  <div class="need"><span>Mood</span><div class="bar"><i id="mood"></i></div><b id="moodN" style="font-size:12px;width:24px;text-align:right"></b></div>
  <div class="row muted" id="counts"></div>
  <div class="row">
    <label class="muted" for="policy">Plan package</label>
    <select id="policy" aria-label="Plan package">
      <option value="none">No package</option>
      <option value="balanced">Balanced</option>
      <option value="minimal-change">Minimal change</option>
      <option value="most-popular">Most popular</option>
    </select>
    <button id="stormBtn" type="button">Storm</button>
  </div>
  <div class="row" style="margin-top:2px">
    <label class="muted" for="planYear">Year of plan</label>
    <input id="planYear" type="range" min="0" max="10" step="1" value="0" style="flex:1" />
    <span id="planYearN" class="muted" style="min-width:52px;text-align:right">Year 0</span>
  </div>
  <div class="row" style="margin-top:2px">
    <label class="muted" for="overlayMode">Overlay</label>
    <select id="overlayMode" aria-label="Overlay mode">
      <option value="none">none</option>
      <option value="flood">flood</option>
      <option value="commute">commute</option>
      <option value="journals">journals</option>
      <option value="wellbeing">well-being</option>
      <option value="cycle" disabled>cycle result</option>
    </select>
    <span class="muted" id="overlayLegend"></span>
  </div>
  <div class="row" style="margin-top:2px">
    <button id="runCycleBtn" type="button" title="Apply the selected plan for a simulated week and compare against no plan">Run cycle</button>
    <button id="cycleShowBtn" type="button" hidden title="Reopen the cycle results panel">Show results</button>
    <button id="demoBtn" type="button" title="Play three cycles hands-free on a pinned town">▶ Play demo</button>
    <span class="muted" id="cycleStatus">One week, plan vs no plan</span>
  </div>
  <div class="row" style="margin-top:2px">
    <button id="runExperimentBtn" type="button">Run 10 years</button>
    <span class="muted" id="experimentStatus">Idle</span>
  </div>
  <div class="row" style="margin-top:2px">
    <span class="exp-compare" id="experimentCompare">No completed run yet.</span>
  </div>
  <div class="exp-seed" id="experimentSeedRow">
    <span>Seed:</span>
    <code id="experimentSeed" title="Experiment seed"></code>
    <button id="copyExperimentSeed" type="button" aria-label="Copy experiment seed">Copy</button>
    <input id="experimentSeedInput" type="text" aria-label="Experiment seed input" placeholder="enter seed" />
    <button id="resetExperimentSeed" class="icon" type="button" aria-label="Reset to default seed" title="Reset to default seed">↺</button>
    <button id="rerunExperimentSeed" type="button" aria-label="Rerun with this seed">Rerun</button>
  </div>

  <div class="muted" id="policyNote"></div>
  <div class="legend">
    <span><i style="background:#d9cbb4"></i>home</span><span><i style="background:#8fa6c4"></i>work</span>
    <span><i style="background:#e0875a"></i>food</span><span><i style="background:#c9a23a"></i>shop</span>
    <span><i style="background:#9b7fd1"></i>school</span><span><i style="background:#7fb26a"></i>park</span>
  </div>
  <div class="muted" id="source" style="margin-top:6px"></div>
  <div class="muted" id="realConditions" style="margin-top:6px"></div>
  <div class="muted" id="journaldiag" style="margin-top:6px"></div>
  <div class="muted" id="netdiag" style="margin-top:6px"></div>
  <div id="netwarn" class="warn" hidden></div>
  <details id="netdiagDetails" class="muted" hidden>
    <summary>Overpass endpoint errors</summary>
    <div id="netdiagErrors"></div>
  </details>
</div>

<div class="panel" id="feed" aria-live="polite"></div>
<div class="panel" id="inspect"></div>
<div class="panel" id="experimentPanel" style="display:none">
  <h1>10-year experiment</h1>

  <div class="exp-grid" id="experimentCharts"></div>
  <div id="experimentTableWrap"></div>
  <div class="exp-footnote">Simulated outcomes with synthetic residents — illustrative, not a forecast.</div>
</div>

<div class="panel" id="cyclePanel" style="display:none"></div>

<div class="panel" id="demoBar" hidden aria-live="polite">
  <div id="demoStep" class="muted"></div>
  <div id="demoCaption"></div>
  <div class="row" style="margin:6px 0 0;justify-content:flex-end">
    <button id="demoPause" type="button">❚❚ Pause</button>
    <button id="demoSkip" type="button" title="Skip to the next step">Next ⏭</button>
    <button id="demoStop" type="button">Stop</button>
  </div>
</div>

<script type="module" src="/world/render.js"></script>
</body>
</html>
