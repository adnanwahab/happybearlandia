<!doctype html><html><head><title>Actual worker UI verification fixture</title><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script><link rel="stylesheet" href="./world-views.css"></head><body><h1>Actual worker records · component verification fixture</h1><p>No fabricated outcomes: two worker runtimes, shared seed/context, reviewed wage multiplier treatment. Small synthetic population, not the full city.</p><div id="controls"></div><p id="status">Starting actual workers</p><div id="world"></div><div id="child"></div><script type="module">
import {createPopulationRuntime} from '../population/runtime.js';
import {mountRealityWorldView} from './world-views.js';
import {mountChildInspector} from '../population/child-inspector.js';
const status=document.querySelector('#status'),controls=document.querySelector('#controls'),childHost=document.querySelector('#child');
const context={buildings:[{id:'home',kind:'home',center:[-40,0],poly:[[-50,-10],[-30,-10],[-30,10],[-50,10]]},{id:'school',kind:'school',center:[40,0],poly:[[30,-10],[50,-10],[50,10],[30,10]]}],districts:[{id:'d0',x:-40,z:0,population:100,housingUnits:50,jobs:50,schoolCapacity:40},{id:'d1',x:40,z:0,population:100,housingUnits:50,jobs:50,schoolCapacity:40}]};
const a=createPopulationRuntime({config:{population:80,seed:42},worldContext:context}),b=createPopulationRuntime({config:{population:80,seed:42,wageMultiplier:1.5},worldContext:context});await Promise.all([a.ready,b.ready]);a.pause();b.pause();await Promise.all([a.stepToTime(600),b.stepToTime(600)]);a.pause();b.pause();
const inspector=mountChildInspector(childHost,{onSelect:async id=>{inspector.update(await b.inspectPerson(id));status.textContent='Inspected actual worker person '+id;}}),world=mountRealityWorldView(document.querySelector('#world'),{onSelect:selection=>{status.textContent='Selected actual '+selection.kind+' '+selection.id;if(selection.kind==='person'||selection.kind==='visibleAgents')b.inspectPerson(selection.id).then(row=>inspector.update(row));}});
world.update({engine:'population',state:b.getSnapshot(),baselineState:a.getSnapshot(),worldContext:context});
const children=b.getSnapshot().visibleAgents.filter(row=>row.child);for(const row of children.slice(0,3)){const button=document.createElement('button');button.textContent='Inspect actual child '+row.id;button.onclick=async()=>{inspector.update(await b.inspectPerson(row.id));status.textContent='Inspected actual worker child '+row.id;};controls.append(button);}status.textContent='Actual paired workers ready · '+children.length+' sampled children';
</script></body></html>
