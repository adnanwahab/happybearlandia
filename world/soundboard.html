<script>
'use strict';
const data=JSON.parse(document.getElementById('sound-data').textContent);
const clips=data.clips||[], byId=new Map(clips.map(c=>[String(c.id),c]));
const $=id=>document.getElementById(id), make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const fmt=n=>(Number(n)||0).toFixed(2), stamp=n=>{n=Number(n)||0;return Math.floor(n/60)+':'+(n%60).toFixed(2).padStart(5,'0');};
const fileName=c=>(c.wav||c.ogg||c.slug||String(c.id)).split('/').pop();
const source=c=>data.standalone?c.ogg_data:((player.canPlayType('audio/ogg; codecs="vorbis"')||!c.wav)?c.ogg:c.wav);
const player=new Audio();player.preload='auto';player.volume=.35;
let current=null, category='All', triedFallback=false, toastTimer;
document.title='Soundboard · HappyBearLandia';$('title').textContent='HappyBearLandia soundboard';$('count').textContent=clips.length;
$('label-note').textContent=data.label_note||'Labels describe acoustic features identified from waveform and spectrogram analysis; original sound-effect names have not been verified.';
$('footer').textContent=data.standalone?'This page includes all OGG audio and works offline. The ZIP also contains WAV files, the sound index, and game integration metadata.':'All 20 clips are hosted in HappyBearLandia. Download WAV or OGG files below; source times refer to your supplied compilation.';
function toast(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').style.display='none';},2300);}
function stop(){player.pause();player.currentTime=0;sync();}
async function play(c){
  if(current&&String(current.id)===String(c.id)&&!player.paused){player.pause();sync();return;}
  if(!current||String(current.id)!==String(c.id)){player.pause();current=c;triedFallback=false;player.src=source(c);player.currentTime=0;}
  try{await player.play();}catch(e){toast('Playback could not start. Try the downloaded WAV from the ZIP.');}sync();
}
function sync(){
 const active=current&&!player.paused;let fraction=current&&player.duration>0?player.currentTime/player.duration:0;
 for(const card of document.querySelectorAll('.card')){const same=current&&card.dataset.id===String(current.id);card.classList.toggle('active',!!same);const btn=card.querySelector('.play');btn.classList.toggle('playing',!!(same&&active));const item=byId.get(card.dataset.id);btn.setAttribute('aria-label',(same&&active?'Pause ':'Play ')+item.label);const bars=card.querySelectorAll('.wavebox i');bars.forEach((bar,i)=>bar.classList.toggle('played',!!same&&i<Math.floor(fraction*bars.length)));}
 $('lamp').classList.toggle('on',!!active);$('now').textContent=current?(active?'':player.currentTime>0?'Paused · ':'Ready · ')+current.label:'Choose a sound to begin';$('progress').textContent=current?fmt(player.currentTime)+' / '+fmt(Number.isFinite(player.duration)?player.duration:current.duration_seconds)+' s':'0.00 / 0.00 s';
}
player.addEventListener('timeupdate',sync);player.addEventListener('pause',sync);player.addEventListener('play',sync);player.addEventListener('ended',()=>{player.currentTime=0;sync();});
player.addEventListener('error',async()=>{if(current&&!data.standalone&&!triedFallback&&current.wav){triedFallback=true;player.src=current.wav;try{await player.play();}catch(e){toast('Could not play this file. Check that the audio folders are under /world/audio/goofy/.');}}else{toast('Audio unavailable in this browser. Download the clip or use the WAV in the ZIP.');}sync();});
async function copyName(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const ta=make('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();const success=document.execCommand('copy');ta.remove();if(!success)throw new Error('copy unavailable');}toast('Copied '+text);}catch(e){window.prompt('Copy this filename:',text);}}
function render(){
 const query=$('search').value.trim().toLowerCase();const visible=clips.filter(c=>(category==='All'||c.category===category)&&[c.label,c.slug,c.category,c.description,c.suggested_use,c.id].join(' ').toLowerCase().includes(query));
 $('results').textContent=visible.length+' of '+clips.length+' sounds';const frag=document.createDocumentFragment();
 for(const c of visible){
  const card=make('article','card');card.dataset.id=String(c.id);const top=make('div','card-top');top.append(make('span','category',c.category||'Sound effect'),make('span','number',String(c.number||clips.indexOf(c)+1).padStart(2,'0')));card.append(top,make('h2','',c.label),make('p','description',c.description||''));
  const row=make('div','playline'), btn=make('button','play');btn.type='button';btn.setAttribute('aria-label','Play '+c.label);const icon=make('span','icon');icon.setAttribute('aria-hidden','true');btn.append(icon);btn.addEventListener('click',()=>play(c));
  const wave=make('div','wavebox');wave.setAttribute('aria-hidden','true');wave.title='Click to seek while this clip is playing';let shape=Array.isArray(c.waveform)&&c.waveform.length?c.waveform:[.1,.2,.25,.4,.6,.8,1,.6,.4,.7,.4,.3,.1];shape.forEach(v=>{const bar=make('i');bar.style.height=Math.max(2,Math.min(1,Math.max(0,Number(v)||0))*40)+'px';wave.append(bar);});wave.addEventListener('click',e=>{if(current&&String(current.id)===String(c.id)&&Number.isFinite(player.duration)){const box=wave.getBoundingClientRect();player.currentTime=Math.max(0,Math.min(1,(e.clientX-box.left)/box.width))*player.duration;sync();}});row.append(btn,wave,make('span','duration',fmt(c.duration_seconds)+' s'));card.append(row);
  const meta=make('div','meta');meta.append(make('span','', 'Source '+stamp(c.source_start_seconds)+' – '+stamp(c.source_end_seconds)),make('span','',String(c.id)));card.append(meta);
  if(c.suggested_use){const use=make('p','use');use.append(make('strong','','Game cue'),document.createTextNode(c.suggested_use));card.append(use);}
  const filename=fileName(c), fileline=make('div','fileline'), code=make('code','filename',filename);code.title=filename;const copy=make('button','copy','Copy name');copy.type='button';copy.addEventListener('click',()=>copyName(filename));fileline.append(code,copy);card.append(fileline);
  const downloads=make('div','downloads');if(!data.standalone&&c.wav){const a=make('a','download','↓ WAV');a.href=c.wav;a.download=c.wav.split('/').pop();a.setAttribute('aria-label','Download '+c.label+' WAV');downloads.append(a);}if(c.ogg){const a=make('a','download','↓ OGG');a.href=data.standalone?c.ogg_data:c.ogg;a.download=c.ogg.split('/').pop();a.setAttribute('aria-label','Download '+c.label+' OGG');downloads.append(a);}card.append(downloads);frag.append(card);
 }
 if(!visible.length)frag.append(make('div','empty','No matching sounds. Try another search or category.'));$('grid').replaceChildren(frag);sync();
}
function filters(){const cats=['All',...new Set(clips.map(c=>c.category||'Sound effect'))];for(const cat of cats){const b=make('button','filter'+(cat===category?' active':''),cat);b.type='button';b.setAttribute('aria-pressed',cat===category?'true':'false');b.addEventListener('click',()=>{category=cat;for(const button of $('filters').children){const on=button===b;button.classList.toggle('active',on);button.setAttribute('aria-pressed',on?'true':'false');}render();});$('filters').append(b);}}
$('search').addEventListener('input',render);$('stop').addEventListener('click',stop);$('barstop').addEventListener('click',stop);$('volume').addEventListener('input',()=>{player.volume=Number($('volume').value)/100;$('volume-value').value=$('volume').value+'%';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stop();}});filters();render();
</script>
