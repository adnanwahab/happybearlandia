<body><header><div><h1>Meet the neighborhood</h1><p>Pants, T-shirts, and a little color.</p></div><a href="./human-person.glb" download>Download .glb</a></header><footer>Drag to turn · Scroll to zoom · Original CC0 model</footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createHumanInstances} from '../render/people/human-renderer.js';
import { createWebGPUDemoRenderer, showWebGPUError, manageWebGPUDemo } from "/tools/webgpu-demo-runtime.js";
try {

const renderer=await createWebGPUDemoRenderer(THREE, {antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f0f2ed');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,100);camera.position.set(4.5,3.2,8.5);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=2;controls.maxDistance=16;
scene.add(new THREE.HemisphereLight('#ffffff','#adbea7',2.5));const key=new THREE.DirectionalLight('#fff8e8',3);key.position.set(3,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#e4e9df',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const humans=createHumanInstances({THREE,count:5});scene.add(humans.root);await humans.ready;
for(let i=0;i<5;i++)humans.setPerson(i,{id:`neighbor-${i}`,x:(i-2)*1.1,z:i===2?.28:0,heading:(i-2)*-.10,shirtColor:['#e56e65','#74b1db','#76b87c','#e4bd52','#a68bd0'][i]});humans.commit();for(const part of humans.parts){part.castShadow=true;part.receiveShadow=true;}
window.humanPreview={ready:true,assetStatus:humans.assetStatus,parts:humans.parts.map(part=>part.name)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function frame(){controls.update();renderer.render(scene,camera)}
manageWebGPUDemo(renderer, scene, controls);
await renderer.setAnimationLoop(frame);

} catch (error) { showWebGPUError(error); }
</script></body></html>
