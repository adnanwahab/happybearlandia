<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Three-month target: one inspectable journey</title><desc id="desc">Proposed for February 11, 2027 · Direction and acceptance goals, not shipped capabilities. Acceptance: repeatable comparison → exact evidence link → share/reopen; missing data stays visible.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#87a8b8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="790" rx="24" fill="#101d2c"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="53" fill="#6fe2bd" font-size="14" font-weight="700" letter-spacing="2">HAPPYBEARLANDIA / ARCHITECTURE</text>
<text x="48" y="100" fill="#f4f7fc" font-size="34" font-weight="700">Three-month target: one inspectable journey</text>
<text x="48" y="133" fill="#b6c8d9" font-size="17">Proposed for February 11, 2027 · Direction and acceptance goals, not shipped capabilities.</text>
<text x="48" y="180" fill="#9ab3c8" font-size="13" font-weight="700" letter-spacing="1.5">01 / ONE USER JOURNEY</text>
<rect x="48.0" y="195" width="356.0" height="112" rx="12" fill="#1b3044" stroke="#39566f"/>
<text x="68.0" y="225" fill="#f4f7fc" font-size="19" font-weight="700">Explore a place</text>
<text x="68.0" y="252" fill="#bed0df" font-size="15">Select a supported entity</text>
<text x="68.0" y="275" fill="#bed0df" font-size="15">Show source and model scope</text>
<rect x="422.0" y="195" width="356.0" height="112" rx="12" fill="#1b3044" stroke="#39566f"/>
<text x="442.0" y="225" fill="#f4f7fc" font-size="19" font-weight="700">Compare futures</text>
<text x="442.0" y="252" fill="#bed0df" font-size="15">Baseline + intervention, matched seeds</text>
<text x="442.0" y="275" fill="#bed0df" font-size="15">Shared selection and supported units</text>
<rect x="796.0" y="195" width="356.0" height="112" rx="12" fill="#1b3044" stroke="#39566f"/>
<text x="816.0" y="225" fill="#f4f7fc" font-size="19" font-weight="700">Explain + share</text>
<text x="816.0" y="252" fill="#bed0df" font-size="15">Open event evidence and assumptions</text>
<text x="816.0" y="275" fill="#bed0df" font-size="15">Reopen the selected run and time</text>
<path d="M600 310V337" stroke="#87a8b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="350" fill="#9ab3c8" font-size="13" font-weight="700" letter-spacing="1.5">02 / EXPLICIT INTEGRATION</text>
<rect x="48.0" y="365" width="543.0" height="112" rx="12" fill="#1b3044" stroke="#6fe2bd"/>
<text x="68.0" y="395" fill="#f4f7fc" font-size="19" font-weight="700">Authority-scoped adapters</text>
<text x="68.0" y="422" fill="#bed0df" font-size="15">Map entity, clock and metric semantics</text>
<text x="68.0" y="445" fill="#bed0df" font-size="15">Reject unsupported mappings</text>
<rect x="609.0" y="365" width="543.0" height="112" rx="12" fill="#1b3044" stroke="#6fe2bd"/>
<text x="629.0" y="395" fill="#f4f7fc" font-size="19" font-weight="700">Versioned run + evidence interfaces</text>
<text x="629.0" y="422" fill="#bed0df" font-size="15">Model/rules, seed, inputs and ancestry</text>
<text x="629.0" y="445" fill="#bed0df" font-size="15">Checkpoint references and replay status</text>
<path d="M600 480V507" stroke="#87a8b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="520" fill="#9ab3c8" font-size="13" font-weight="700" letter-spacing="1.5">03 / EXISTING FOUNDATIONS, HARDENED</text>
<rect x="48.0" y="535" width="543.0" height="112" rx="12" fill="#1b3044" stroke="#39566f"/>
<text x="68.0" y="565" fill="#f4f7fc" font-size="19" font-weight="700">Independent simulation engines</text>
<text x="68.0" y="592" fill="#bed0df" font-size="15">Keep City, Population and housing owners</text>
<text x="68.0" y="615" fill="#bed0df" font-size="15">Bound execution and cancellation</text>
<rect x="609.0" y="535" width="543.0" height="112" rx="12" fill="#1b3044" stroke="#39566f"/>
<text x="629.0" y="565" fill="#f4f7fc" font-size="19" font-weight="700">Bun + durable model stores</text>
<text x="629.0" y="592" fill="#bed0df" font-size="15">Permission checks for persistent sharing</text>
<text x="629.0" y="615" fill="#bed0df" font-size="15">Retention, backup and restore validation</text>
<rect x="48" y="705" width="1104" height="48" rx="10" fill="#253d42"/><text x="68" y="735" fill="#b9f3db" font-size="15">Acceptance: repeatable comparison → exact evidence link → share/reopen; missing data stays visible.</text></g></svg>