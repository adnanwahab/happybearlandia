<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painting outside the frame</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e1d4;color:#292a27;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh}header{position:absolute;top:clamp(20px,5vw,60px);left:6vw;pointer-events:none}small{letter-spacing:.22em;text-transform:uppercase;font-size:10px}h1{font:400 clamp(28px,4vw,56px)/1.05 Georgia,serif;margin:12px 0}header p{font-size:13px;max-width:260px;line-height:1.6;color:#666258}.controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(640px,92vw);background:#fff9;backdrop-filter:blur(20px);border:1px solid #fff9;border-radius:18px;padding:16px;box-shadow:0 10px 40px #3b2a1715}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{border:1px solid #c9c1b4;background:#fff9;color:#34352f;border-radius:8px;padding:9px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #227e9b;outline-offset:3px}label{font-size:12px}input{accent-color:#225e71}#timeline{flex:1;min-width:100px}#status{font-size:11px;margin:10px 0 0;color:#595b51}#error{position:absolute;top:45%;left:15%;width:70%;padding:24px;background:#fff;border-radius:12px;text-align:center}select{max-width:130px}@media(max-width:600px){header p{display:none}header{top:22px}h1{max-width:240px}.controls{bottom:12px}}
</style></head><body>
<canvas aria-label="An expanding painted flower spills beyond a small golden picture frame"></canvas><header><small>Living gallery · 01</small><h1>Painting outside<br>the frame.</h1><p>A small still life becomes something too expansive to contain.</p></header>
<div id="error" role="alert" hidden></div><section class="controls" aria-label="Mural controls"><div class="row"><button id="play">Pause</button><button id="restart">Restart</button><label for="timeline">Bloom</label><input id="timeline" type="range" min="0" max="100" step="0.1" value="0"><output id="percent">0%</output></div><div class="row" style="margin-top:12px"><label>Speed <select id="speed"><option value="0.5">Slow</option><option value="1" selected>Natural</option><option value="2">Fast</option></select></label><label>Pigment <select id="palette"><option value="0">Ember & cobalt</option><option value="1">Iris & jade</option></select></label></div><p id="status" role="status">Preparing the gallery…</p></section>
<script type="module">
const canvas=document.querySelector('canvas'),play=document.querySelector('#play'),timeline=document.querySelector('#timeline'),status=document.querySelector('#status');
let progress=matchMedia('(prefers-reduced-motion: reduce)').matches?1:0,paused=progress===1,failed=false;
const shader=`
struct Params {size:vec2f, progress:f32, palette:f32};
@group(0) @binding(0) var<uniform> u:Params;
@vertex fn vs(@builtin(vertex_index) i:u32)->@builtin(position) vec4f {var p=array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));return vec4f(p[i],0,1);}
fn hash(p:vec2f)->f32{return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453);}
fn noise(p:vec2f)->f32{let i=floor(p);let f=fract(p);let s=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2f(1,0)),s.x),mix(hash(i+vec2f(0,1)),hash(i+vec2f(1)),s.x),s.y);}
fn fbm(p:vec2f)->f32{return noise(p)*.55+noise(p*2.03)*.27+noise(p*4.1)*.13+noise(p*8.3)*.05;}
@fragment fn fs(@builtin(position) pos:vec4f)->@location(0) vec4f{
let uv=pos.xy/u.size;let scale=max(u.size.x/u.size.y,1.25);let p=(uv-vec2f(.5,.49))*vec2f(scale,1.)*2.4;
let r=length(p);let a=atan2(p.y,p.x);let n=fbm(p*5.);let grain=hash(pos.xy);
var col=vec3f(.91,.89,.84)*( .97+grain*.045);let floorMask=smoothstep(.84,.845,uv.y);col=mix(col,vec3f(.73,.69,.61)+vec3f((uv.y-.84)*.4),floorMask);
let edge=r-n*.17;let spread=u.progress*1.95;let paint=1.-smoothstep(spread-.025,spread+.025,edge);
let petalRadius=.79+sin(a*7.+sin(a*3.)*.5)*.13;let rose=1.-smoothstep(petalRadius-.03,petalRadius+.03,r);
let folds=sin(a*8.-r*30.+n*5.)*.5+.5;let blue=mix(vec3f(.025,.13,.32),vec3f(.08,.51,.72),n);
let warm=mix(vec3f(.56,.035,.13),vec3f(1.,.47,.055),folds);let cool=mix(vec3f(.19,.055,.38),vec3f(.78,.36,.72),folds);
let pigment=mix(warm,cool,u.palette);let reveal=1.-smoothstep(spread-.25,spread-.12,edge);
col=mix(col,blue,paint*(1.-smoothstep(spread-.45,spread-.30,edge))*.25+paint*smoothstep(spread-.4,spread-.1,edge));
col=mix(col,pigment*(.87+n*.25+grain*.08),rose*paint*reveal);
let streak=pow(noise(vec2f(a*45.,r*130.)),8.);col+=vec3f(streak*.17)*paint;
let q=p-vec2f(0,-.025);let box=max(abs(q.x)/.155,abs(q.y)/.205);let shadow=max(abs(q.x-.018)/.18,abs(q.y-.025)/.23);col*=1.-(1.-smoothstep(.95,1.2,shadow))*.18;
if(box<1.){col=vec3f(.89,.89,.79);let stem=1.-smoothstep(.004,.009,abs(q.x+.015*sin(q.y*8.)));col=mix(col,vec3f(.16,.32,.13),stem);for(var i=0;i<3;i++){let center=vec2f(sin(f32(i)*2.)*.062,-.10+f32(i)*.072);let d=length(q-center);let flower=1.-smoothstep(.029,.041+sin(atan2(q.y-center.y,q.x-center.x)*6.)*.007,d);col=mix(col,vec3f(.48,.18,.52),flower);}}
if(box>=1. && box<1.19){let bevel=sin((box-1.)/.19*3.14159);col=mix(vec3f(.32,.17,.045),vec3f(.91,.68,.29),bevel);col+=grain*.055;}
let vignette=1.-.14*length(uv-.5);return vec4f(col*vignette,1.);
}`;
function sync(){timeline.value=progress*100;document.querySelector('#percent').value=Math.round(progress*100)+'%';play.textContent=paused?'Play':'Pause';}
function fail(message){failed=true;document.querySelector('#error').hidden=false;document.querySelector('#error').textContent=message;status.textContent='Gallery unavailable';document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);}
try{
if(!navigator.gpu)throw Error('WebGPU is unavailable. Open this gallery in a WebGPU-enabled browser over HTTPS or localhost.');
const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('No WebGPU adapter is available on this device.');
const device=await adapter.requestDevice(),context=canvas.getContext('webgpu'),format=navigator.gpu.getPreferredCanvasFormat();
device.lost.then(()=>fail('The GPU connection was lost. Reload this page to reopen the gallery.'));
device.addEventListener('uncapturederror',e=>fail('The gallery could not render: '+e.error.message));
context.configure({device,format,alphaMode:'opaque'});
const module=device.createShaderModule({code:shader});const info=await module.getCompilationInfo();if(info.messages.some(m=>m.type==='error'))throw Error(info.messages.filter(m=>m.type==='error').map(m=>m.message).join('; '));
const pipeline=await device.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});
const buffer=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});const bind=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer}}]});
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=Math.min(device.limits.maxTextureDimension2D,Math.round(innerWidth*d));canvas.height=Math.min(device.limits.maxTextureDimension2D,Math.round(innerHeight*d));}resize();addEventListener('resize',resize);
play.onclick=()=>{if(progress>=1)progress=0;paused=!paused;sync();};document.querySelector('#restart').onclick=()=>{progress=0;paused=false;sync();};timeline.oninput=()=>{progress=Number(timeline.value)/100;paused=true;sync();};
let last=performance.now();function frame(now){if(failed)return;const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!document.hidden){progress=Math.min(1,progress+dt/16*Number(document.querySelector('#speed').value));if(progress===1)paused=true;}sync();device.queue.writeBuffer(buffer,0,new Float32Array([canvas.width,canvas.height,progress,Number(document.querySelector('#palette').value)]));const encoder=device.createCommandEncoder();const pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});pass.setPipeline(pipeline);pass.setBindGroup(0,bind);pass.draw(3);pass.end();device.queue.submit([encoder.finish()]);requestAnimationFrame(frame);}status.textContent='WebGPU · Scrub to explore the bloom';sync();requestAnimationFrame(frame);
}catch(error){fail(error.message);}
</script></body></html>
