<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every voice · Particle conversation</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background: #070b12; color: #eef3fc; --accent: 99, 169, 255; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  #app { position: relative; isolation: isolate; height: 100svh; min-height: 700px;
    overflow: hidden; background: radial-gradient(ellipse at 50% 66%, #102035 0%, #070b12 62%); }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  header { display: flex; justify-content: space-between; align-items: center;
    padding: 28px 4.5%; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: #a7b6ca; }
  .logo { width: 23px; height: 23px; border: 1px solid #749ec9; border-radius: 50%;
    box-shadow: inset 0 0 0 5px #070b12, inset 0 0 0 6px #749ec9; }
  .controls { display: flex; gap: 8px; }
  .control { background: #111a2788; border: 1px solid #293448; border-radius: 100px;
    padding: 9px 14px; font-size: 11px; color: #c0cde0; }
  .control[aria-pressed="true"] { border-color: #6c91b3; color: #fff; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
  .intro { margin: 14px 20px 0; text-align: center; pointer-events: none; }
  h1 { font-weight: 450; font-size: clamp(28px, 3.3vw, 48px); letter-spacing: -.045em;
    line-height: 1.2; margin: 0; }
  h1 span { color: #8193ad; }
  .intro p { margin: 14px 0 0; color: #8393aa; font-size: 13px; }
  #bubbles { position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
    display: flex; align-items: start; gap: 24px; width: min(880px, 90%); }
  .bubble { --tint: 103, 170, 255; position: relative; flex: 1; min-width: 0;
    text-align: left; padding: 21px 22px 18px; border-radius: 20px;
    border: 1px solid #2a374b; background: #101925ee;
    transition: border-color .35s, box-shadow .35s, background .35s; }
  .bubble:nth-child(2) { margin-top: 24px; }
  .bubble::after { content: ""; position: absolute; bottom: -9px; left: 34px;
    width: 16px; height: 16px; transform: rotate(45deg); background: #101925;
    border-right: 1px solid #2a374b; border-bottom: 1px solid #2a374b;
    transition: border-color .35s; }
  .bubble[data-active="true"] { border-color: rgba(var(--tint), .7);
    box-shadow: 0 0 32px rgba(var(--tint), .10), inset 0 0 28px rgba(var(--tint), .035); }
  .bubble[data-active="true"]::after { border-color: rgba(var(--tint), .7); }
  .tag { display: flex; align-items: center; gap: 8px; font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; color: rgb(var(--tint)); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .message { display: block; min-height: 65px; margin-top: 15px;
    font-size: clamp(17px, 1.7vw, 23px); font-weight: 450; letter-spacing: -.035em;
    line-height: 1.38; }
  .word { display: inline-block; opacity: 0; transform: translateY(8px);
    filter: blur(3px); transition: opacity .2s, transform .25s, filter .25s; }
  .word.shown { opacity: 1; transform: translateY(0); filter: blur(0); }
  .pattern { display: block; margin-top: 10px; font-size: 10px; color: #8b9cb2; }
  .bubble[data-active="true"] .pattern { color: rgb(var(--tint)); }
  #readout { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
    text-align: center; pointer-events: none; }
  #meter { height: 24px; display: flex; align-items: center; justify-content: center;
    gap: 4px; margin-bottom: 13px; }
  #meter i { display: block; width: 3px; height: 22px; border-radius: 10px;
    background: rgb(var(--accent)); transform: scaleY(.12); opacity: .8; }
  #mode-name { font-size: 10px; letter-spacing: .17em; text-transform: uppercase;
    color: #a4b3c8; white-space: nowrap; }
  footer { position: absolute; bottom: 24px; left: 4.5%; right: 4.5%; display: flex;
    justify-content: space-between; gap: 16px; border-top: 1px solid #1e2b3b;
    padding-top: 16px; font-size: 10px; color: #8595aa; letter-spacing: .035em; }
  #error { position: absolute; top: 64%; left: 50%; transform: translate(-50%, -50%);
    width: min(420px, 88%); padding: 20px; text-align: center; border-radius: 16px;
    background: #151d2a; border: 1px solid #587398; font-size: 14px; line-height: 1.6; }
  [hidden] { display: none !important; }
  @media (max-width: 620px) {
    #app { min-height: 780px; }
    header { padding: 22px 5%; gap: 8px; }
    .brand { font-size: 9px; gap: 7px; letter-spacing: .10em; }
    .control { padding: 8px 10px; font-size: 10px; }
    .intro { margin-top: 18px; }
    .intro p { max-width: 265px; margin: 12px auto 0; line-height: 1.6; }
    #bubbles { top: 24%; width: 90%; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .bubble { flex: 0 0 calc(50% - 5px); padding: 14px; border-radius: 14px; }
    .bubble:nth-child(2) { margin-top: 0; }
    .bubble:last-child { flex-basis: 70%; margin-top: 7px; }
    .tag { font-size: 8px; letter-spacing: .08em; }
    .message { min-height: 46px; margin-top: 10px; font-size: 18px; }
    .bubble:last-child .message { min-height: 25px; }
    .pattern { font-size: 9px; margin-top: 8px; }
    #readout { bottom: 10%; }
    footer { bottom: 17px; font-size: 9px; }
    footer span:last-child { max-width: 135px; text-align: right; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { transition: none !important; }
  }
  #app.paused .word { transition: none; }
</style>
</head>
<body>
<main id="app" aria-label="Interactive particle conversation about voting">
  <canvas id="canvas" aria-hidden="true"></canvas>
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"></span> Civic frequencies</div>
    <div class="controls">
      <button class="control" id="auto" type="button" aria-pressed="true">Auto: on</button>
      <button class="control" id="pause" type="button" aria-pressed="false">Pause</button>
    </div>
  </header>
  <div class="intro">
    <h1>Every voice <span>has a frequency.</span></h1>
    <p>Three thoughts. One shared future. Choose a voice to see its rhythm.</p>
  </div>
  <section id="bubbles" aria-label="Choose a voice and particle pattern"></section>
  <div id="readout">
    <div id="meter" aria-hidden="true"></div>
    <div id="mode-name">Loading the conversation</div>
  </div>
  <footer>
    <span>1–3 select · Space pauses · R replays</span>
    <span id="detail">Simulated speech rhythm · No audio</span>
  </footer>
  <div id="error" role="alert" hidden></div>
</main>
<script type="module">
const errorBox = document.querySelector('#error');
try {
  await start();
} catch (error) {
  console.error(error);
  errorBox.hidden = false;
  errorBox.textContent = 'WebGPU could not start. Use a WebGPU-capable browser on HTTPS or localhost. ' + error.message;
}

async function start() {
  if (!navigator.gpu) throw new Error('WebGPU is unavailable in this browser.');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('No compatible GPU was found.');
  const device = await adapter.requestDevice();
  const canvas = document.querySelector('#canvas');
  const context = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({device, format, alphaMode:'premultiplied'});
  device.lost.then(info => {
    errorBox.hidden = false;
    errorBox.textContent = 'GPU interrupted. Reload to restart. ' + info.message;
  });
  const VOICES = [
    {text:'Let’s hear every voice.',label:'01 · Listen',pattern:'Blue · expanding ripples',tint:'103, 170, 255'},
    {text:'I vote yes!',label:'02 · Decide',pattern:'Green · rising spirals',tint:'100, 241, 163'},
    {text:'Our votes shape tomorrow.',label:'03 · Imagine',pattern:'Rainbow · flowing waves',tint:'225, 166, 255'}
  ];
  const app = document.querySelector('#app');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COUNT = innerWidth < 620 ? 10000 : 22000;
  const MAX_BEATS = 24, SPEED = 1;
  class Vector {
    constructor(x=0,y=0,z=0){this.set(x,y,z);}
    set(x,y,z=0){this.x=x;this.y=y;this.z=z;return this;}
    lerp(v,a){this.x+=(v.x-this.x)*a;this.y+=(v.y-this.y)*a;this.z+=(v.z-this.z)*a;}
  }
  const THREE = {Vector3:Vector,Vector2:Vector};
  const uniforms = {
    uTime:{value:0},uSpeechTime:{value:0},uWeights:{value:new Vector(1,0,0)},
    uBeats:{value:new Float32Array(MAX_BEATS)},uStrengths:{value:new Float32Array(MAX_BEATS)}
  };
  const params = new Float32Array(12);
  const buffer = device.createBuffer({size:48,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  const shader = device.createShaderModule({code:`
    struct Params { shape:vec4f, view:vec4f, motion:vec4f }
    @group(0) @binding(0) var<uniform> p:Params;
    struct Out { @builtin(position) position:vec4f, @location(0) uv:vec2f, @location(1) color:vec3f }
    fn hash(n:f32)->f32{return fract(sin(n*127.1)*43758.5453);}
    @vertex fn vs(@builtin(vertex_index) v:u32,@builtin(instance_index) i:u32)->Out{
      let n=f32(i); let u=hash(n+1.0); let w=hash(n+9.0); let q=hash(n+31.0);
      let t=p.shape.x; let a=u*6.283185; let z=w*2.0-1.0;
      let r=sqrt(1.0-z*z)*1.7;
      let sphere=vec3f(cos(a)*r,z*1.7,sin(a)*r)*(1.0+0.05*sin(z*15.0-t*2.8));
      let angle=a*2.5+floor(q*3.0)*2.094-t*0.6;
      let spiral=vec3f(cos(angle), (u-0.5)*4.3,sin(angle));
      let lane=floor(q*5.0); let phase=a*1.25+lane*0.6-t*0.7;
      let wave=vec3f((u-0.5)*6.3,sin(phase)*0.63+(lane-2.0)*0.24,cos(phase*0.8+lane)*0.65);
      var pos=sphere*p.shape.y+spiral*p.shape.z+wave*p.shape.w;
      pos*=1.0+p.motion.x*0.07;
      pos.x+=pos.z*p.motion.y; pos.y+=pos.z*p.motion.z;
      let corners=array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(-1,1),vec2f(1,-1),vec2f(1,1));
      let uv=corners[v]; let size=(1.2+q*1.4+p.motion.x)*p.view.w;
      var o:Out;
      o.position=vec4f(pos.x*p.view.z/p.view.x+uv.x*size/p.view.x,
        pos.y*p.view.z/p.view.y+p.motion.w+uv.y*size/p.view.y,0,1);
      o.uv=uv;
      let rainbow=0.5+0.5*cos(vec3f(0,2,4)+u*6.0-t*0.15);
      o.color=(vec3f(0.15,0.48,1)*p.shape.y+vec3f(0.2,1,0.5)*p.shape.z+rainbow*p.shape.w)*(0.45+q*0.5);
      return o;
    }
    @fragment fn fs(o:Out)->@location(0) vec4f{
      let d=dot(o.uv,o.uv); if(d>1.0){discard;}
      let alpha=exp(-d*4.0)*0.65;
      return vec4f(o.color*alpha,alpha);
    }`});
  const pipeline = device.createRenderPipeline({layout:'auto',vertex:{module:shader,entryPoint:'vs'},
    fragment:{module:shader,entryPoint:'fs',targets:[{format,blend:{color:{srcFactor:'one',dstFactor:'one'},alpha:{srcFactor:'one',dstFactor:'one-minus-src-alpha'}}}]},
    primitive:{topology:'triangle-list'}});
  const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer}}]});
  // One timeline drives BOTH word reveals and the particle speech pulses.
  function makeTimeline(text) {
    let cursor = .35;
    const beats = [], strengths = [];
    const words = text.split(/\s+/).filter(Boolean).map((word, index, all) => {
      const at = cursor;
      const duration = .22 + word.replace(/[^a-z]/gi, '').length * .048;
      // Approximate syllables for a visual rhythm, not actual speech analysis.
      const syllables = Math.min(3, Math.max(1, (word.match(/[aeiouy]+/gi) || []).length));
      for (let j = 0; j < syllables && beats.length < MAX_BEATS; j++) {
        beats.push((at + .04 + j * duration / syllables) / SPEED);
        strengths.push(index === all.length - 1 ? 1 : .65 + .15 * (index % 2));
      }
      cursor += duration + (/[.!?,]$/.test(word) ? .30 : .10);
      return { word, at: at / SPEED };
    });
    return { words, beats, strengths, length: Math.max(4.7, cursor / SPEED + 2.0) };
  }
  const timelines = VOICES.map(v => makeTimeline(v.text));
  const buttons = VOICES.map((voice, index) => {
    const button = document.createElement('button');
    button.className = 'bubble';
    button.type = 'button';
    button.style.setProperty('--tint', voice.tint);
    button.setAttribute('aria-label', `${voice.text} ${voice.pattern}`);
    button.setAttribute('aria-pressed', 'false');
    const tag = document.createElement('span');
    tag.className = 'tag';
    const dot = document.createElement('span');
    dot.className = 'dot';
    tag.append(dot, document.createTextNode(voice.label));
    const message = document.createElement('span');
    message.className = 'message';
    message.setAttribute('aria-hidden', 'true');
    const words = timelines[index].words.map(({ word }) => {
      const span = document.createElement('span');
      span.className = 'word shown';
      span.textContent = word;
      message.append(span, document.createTextNode(' '));
      return span;
    });
    const pattern = document.createElement('span');
    pattern.className = 'pattern';
    pattern.textContent = voice.pattern;
    button.append(tag, message, pattern);
    document.querySelector('#bubbles').append(button);
    return { button, words };
  });
  const bars = Array.from({ length: 23 }, () => {
    const bar = document.createElement('i');
    document.querySelector('#meter').append(bar);
    return bar;
  });
  const autoButton = document.querySelector('#auto');
  const pauseButton = document.querySelector('#pause');
  const target = new THREE.Vector3(1, 0, 0);
  let mode = 0, elapsed = 0, speechStart = 0;
  let hovered = null, focused = null;
  let autoplay = !reducedMotion, paused = false;

  function select(index) {
    mode = index;
    speechStart = elapsed;
    target.set(index === 0 ? 1 : 0, index === 1 ? 1 : 0, index === 2 ? 1 : 0);
    uniforms.uBeats.value.fill(-100);
    uniforms.uStrengths.value.fill(0);
    uniforms.uBeats.value.set(timelines[index].beats);
    uniforms.uStrengths.value.set(timelines[index].strengths);
    buttons.forEach(({ button, words }, i) => {
      button.dataset.active = String(i === index);
      button.setAttribute('aria-pressed', String(i === index));
      words.forEach(word => word.classList.toggle('shown', i !== index || reducedMotion));
    });
    app.style.setProperty('--accent', VOICES[index].tint);
    document.querySelector('#mode-name').textContent = VOICES[index].pattern;
  }
  function setAutoplay(value) {
    autoplay = value;
    autoButton.textContent = `Auto: ${value ? 'on' : 'off'}`;
    autoButton.setAttribute('aria-pressed', String(value));
  }
  buttons.forEach(({ button }, index) => {
    button.addEventListener('pointerenter', event => {
      if (event.pointerType === 'touch') return;
      hovered = index;
      select(index);
    });
    button.addEventListener('pointerleave', () => { hovered = null; });
    button.addEventListener('focus', () => {
      if (button.matches(':focus-visible')) { focused = index; select(index); }
    });
    button.addEventListener('blur', () => { focused = null; });
    button.addEventListener('click', () => {
      setAutoplay(false); // Tap/click pins a voice until another is selected.
      select(index);
    });
  });
  autoButton.addEventListener('click', () => setAutoplay(!autoplay));
  pauseButton.addEventListener('click', () => {
    paused = !paused;
    app.classList.toggle('paused', paused);
    pauseButton.textContent = paused ? 'Resume' : 'Pause';
    pauseButton.setAttribute('aria-pressed', String(paused));
  });
  document.addEventListener('keydown', event => {
    if (event.target.closest('button') && event.code === 'Space') return;
    if (['Digit1','Digit2','Digit3'].includes(event.code)) { setAutoplay(false); select(Number(event.code.slice(-1))-1); }
    if (event.code === 'Space') { event.preventDefault(); pauseButton.click(); }
    if (event.code === 'KeyR') select(mode);
  });
  const pointer = new THREE.Vector2();
  app.addEventListener('pointermove', event => {
    const rect = app.getBoundingClientRect();
    pointer.set((event.clientX - rect.left) / rect.width - .5,
      (event.clientY - rect.top) / rect.height - .5);
  });
  app.addEventListener('pointerleave', () => pointer.set(0, 0));

  function resize() {
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(app.clientWidth*dpr); canvas.height=Math.round(app.clientHeight*dpr);
    params[4]=canvas.width; params[5]=canvas.height;
    params[6]=Math.min(canvas.width*.82/6.8,canvas.height*(app.clientWidth<620?.26:.38)/4.7)*2;
    params[7]=dpr;
    params[11]=app.clientWidth<620?-.45:-.29;
  }
  const observer = new ResizeObserver(resize);
  observer.observe(app);
  setAutoplay(autoplay);
  select(0);
  resize();
  document.querySelector('#detail').textContent = `${COUNT.toLocaleString()} particles · Simulated speech · No audio`;

  let previous = performance.now();
  requestAnimationFrame(function frame(now) {
    const dt = Math.min(Math.max((now - previous) / 1000, 0), .05);
    previous = now;
    if (document.hidden) { requestAnimationFrame(frame); return; }
    if (!paused) {
      elapsed += dt;
      let local = elapsed - speechStart;
      const timeline = timelines[mode];
      if (local >= timeline.length) {
        if (autoplay && hovered === null && focused === null) select((mode + 1) % 3);
        else speechStart = elapsed;
        local = 0;
      }
      uniforms.uTime.value = elapsed;
      uniforms.uSpeechTime.value = local;
      uniforms.uWeights.value.lerp(target, reducedMotion ? 1 : 1 - Math.exp(-dt * 3.2));
      buttons[mode].words.forEach((word, i) => {
        word.classList.toggle('shown', reducedMotion || local >= timelines[mode].words[i].at);
      });
      let energy = 0;
      timelines[mode].beats.forEach((beat, i) => {
        energy += timelines[mode].strengths[i] * Math.exp(-Math.pow((local - beat) * 8, 2));
      });
      bars.forEach((bar, i) => {
        const shape = Math.sin((i + 1) / 24 * Math.PI);
        const flicker = .4 + .6 * Math.abs(Math.sin(i * 1.8 + elapsed * 12));
        bar.style.transform = `scaleY(${reducedMotion ? .15 : .12 + Math.min(energy, 1.3) * shape * flicker})`;
      });
    }
    params[0]=reducedMotion?0:elapsed;
    params[1]=uniforms.uWeights.value.x; params[2]=uniforms.uWeights.value.y; params[3]=uniforms.uWeights.value.z;
    params[8]=reducedMotion?0:bars.reduce((sum,bar)=>sum+Number(bar.style.transform.match(/[\d.]+/)?.[0]||0),0)/8;
    params[9]=reducedMotion?0:pointer.x*.25; params[10]=reducedMotion?0:pointer.y*.15;
    device.queue.writeBuffer(buffer,0,params);
    const encoder=device.createCommandEncoder();
    const pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),clearValue:{r:0,g:0,b:0,a:0},loadOp:'clear',storeOp:'store'}]});
    pass.setPipeline(pipeline); pass.setBindGroup(0,group); pass.draw(6,COUNT); pass.end();
    device.queue.submit([encoder.finish()]);
    requestAnimationFrame(frame);
  });

}
</script>
</body>
</html>
