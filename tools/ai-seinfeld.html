<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Seinfeld 3D Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js"}}</script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .seinfeld-font { font-family: 'Permanent Marker', cursive; }
        .script-font { font-family: 'Courier Prime', monospace; }
        header { background: linear-gradient(110deg, #30261c, #111827) !important; }
        #canvas-container { background: radial-gradient(ellipse at center, #334155, #0f172a); }
        #script-feed > div { cursor: pointer; }
        button:focus-visible, [role=button]:focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; }
        #active-speaker-banner { max-height: 35%; overflow: auto; }
        @media(max-width: 640px) { header { flex-wrap: wrap; gap: 10px; padding: 10px !important; } header > div:last-child { flex-wrap: wrap; gap: 8px; } }
        /* Custom scrollbar for script box */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <!-- Top Navigation / Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-slate-950 px-3 py-1 rounded font-black tracking-wider seinfeld-font text-2xl shadow-lg transform -rotate-1">
                SEINFELD AI
            </div>
            <span class="text-xs uppercase tracking-widest text-slate-400 hidden sm:inline-block font-semibold">The 3D Show About Nothing</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex bg-slate-800 p-1 rounded-lg text-xs font-medium">
                <button onclick="switchCamera('wide')" id="cam-wide" class="px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-bold transition">Wide Shot</button>
                <button onclick="switchCamera('couch')" id="cam-couch" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition">Couch View</button>
                <button onclick="switchCamera('kitchen')" id="cam-kitchen" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition">Kitchen View</button>
            </div>
            <button onclick="toggleAudio()" id="audio-btn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-lg border border-slate-700 text-xs flex items-center space-x-1.5 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <span id="audio-label">Slap Bass: Off</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Split View -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

        <!-- Left Column: 3D Scene Container -->
        <div class="flex-1 relative bg-slate-900 flex flex-col min-h-[300px] lg:min-h-0">
            <div id="canvas-container" class="flex-1 w-full h-full relative overflow-hidden cursor-grab active:cursor-grabbing">
                <!-- ThreeJS Canvas goes here -->
            </div>
            
            <!-- Overlay Info on Canvas -->
            <div class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur border border-slate-700/50 px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2 pointer-events-none">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="font-mono text-slate-300">Jerry's Apartment 4A</span>
            </div>

            <!-- Current Speaking Banner -->
            <div id="active-speaker-banner" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur border border-amber-500/40 px-6 py-2 rounded-xl text-center shadow-xl transition-all duration-300 pointer-events-none max-w-lg w-11/12">
                <div id="speaker-name" class="text-amber-400 font-bold text-xs uppercase tracking-wider seinfeld-font">Jerry</div>
                <div id="speaker-line" class="text-sm script-font text-slate-100 mt-0.5">"So what's the deal with airline peanuts? You need a crowbar just to get the salt out!"</div>
            </div>
        </div>

        <!-- Right Column: AI Script Panel & Director Controls -->
        <div class="w-full lg:w-[460px] bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col h-1/2 lg:h-full z-10 shadow-2xl">
            
            <!-- Panel Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <h2 class="font-bold text-slate-200 flex items-center space-x-2 text-sm">
                    <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
                    <span>Live Script & Director's Cut</span>
                </h2>
                <button onclick="clearScript()" class="text-xs text-slate-400 hover:text-amber-400 transition underline">Reset Script</button>
            </div>

            <!-- Script Feed Area -->
            <div id="script-feed" class="flex-1 p-4 overflow-y-auto space-y-3 script-font text-sm bg-slate-950/40">
                <!-- Dialogue items will be dynamically injected here -->
            </div>

            <!-- Director Prompt Control Section -->
            <div class="p-4 border-t border-slate-800 bg-slate-900 space-y-3">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 flex items-center justify-between">
                        <span>Direct the Scene / Story Premise</span>
                        <span class="text-[10px] text-amber-500/80">Local improv generator</span>
                    </label>
                    <div class="flex space-x-2">
                        <input type="text" id="user-prompt" placeholder="e.g., Kramer tries to sell unbranded meat..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                        <button onclick="sendDirectorPrompt()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition shadow flex items-center space-x-1 shrink-0">
                            <span>Direct</span>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons Row -->
                <div class="flex space-x-2">
                    <button onclick="generateNextBeat()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center space-x-2">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span>Generate Next Beat</span>
                    </button>
                    <button onclick="autoPlayToggle()" id="autoplay-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-2 px-4 rounded-lg text-xs transition flex items-center justify-center space-x-1">
                        <span id="autoplay-icon">▶</span>
                        <span id="autoplay-label">Auto-Play</span>
                    </button>
                </div>

                <!-- Quick Prompt Pills -->
                <div class="pt-1 flex flex-wrap gap-1.5">
                    <button onclick="setPromptAndSend('George gets obsessed with a parking spot')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700/60 transition">🚗 Parking Spot</button>
                    <button onclick="setPromptAndSend('Kramer invents a butter shaver')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700/60 transition">🧈 Butter Shaver</button>
                    <button onclick="setPromptAndSend('Elaine dates a man who laughs like Elmer Fudd')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700/60 transition">😂 Elmer Laugh</button>
                    <button onclick="setPromptAndSend('Jerry goes on a date with a dentist')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700/60 transition">🦷 The Dentist</button>
                </div>
            </div>

        </div>

    </div>

    <!-- Application Script & 3D Engine -->
    <script type="module">
        import * as THREE from "three/webgpu";
        // Character definitions & color codes
        const characters = {
            jerry: { name: "Jerry", color: 0x3b82f6, position: { x: -1.2, z: 0.5 }, coat: "Blue Blazer" },
            george: { name: "George", color: 0xef4444, position: { x: 1.2, z: 0.8 }, coat: "Red Jacket" },
            elaine: { name: "Elaine", color: 0x10b981, position: { x: -2.0, z: -1.2 }, coat: "Green Dress" },
            kramer: { name: "Kramer", color: 0xf59e0b, position: { x: 1.8, z: -0.8 }, coat: "Shirt & Jacket" }
        };

        // Initial scripted dialogue queue
        let scriptHistory = [
            { character: 'jerry', text: "So what's the deal with modern coffee shops? You walk in, you need a cartographer just to figure out what kind of milk you're ordering." },
            { character: 'george', text: "It's intimidation, Jerry! They want you to feel small. They want you to panic and just order a plain black coffee like a caveman!" },
            { character: 'elaine', text: "Oh please, George. You panicked yesterday and ordered a 'venti half-caf oat-milk macchiato with extra foam'." },
            { character: 'george', text: "(Defensive) The barista looked at me with authority! I folded!" },
            { character: 'kramer', text: "(Slides through door abruptly) It's all psychological, friends. The milk is alive. You gotta respect the cow." }
        ];

        let currentScriptIndex = 0;
        let isAutoPlaying = false;
        let autoPlayTimer = null;
        let audioEnabled = false;
        let audioCtx = null;

        // Three.js Setup
        let scene, camera, renderer;
        let characterMeshes = {};
        let characterHeads = {};
        let roomGroup;
        let currentCamMode = 'wide';

        // Initialize Three.js Scene
        async function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.08);

            camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
            updateCameraPosition('wide');

            if (!navigator.gpu || !await navigator.gpu.requestAdapter()) throw new Error("WebGPU is unavailable. Open this studio in a WebGPU-capable browser.");
            renderer = new THREE.WebGPURenderer({ antialias: true });
            await renderer.init();
            if (!renderer.backend.isWebGPUBackend) { renderer.dispose(); throw new Error("A WebGPU device could not be started."); }
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffedd5, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xfffbeb, 0.9);
            mainLight.position.set(5, 8, 4);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);

            const warmLamp = new THREE.PointLight(0xf59e0b, 1.2, 10);
            warmLamp.position.set(-3, 3, -2);
            scene.add(warmLamp);

            buildApartment();
            buildCharacters();

            // Window resize handler
            window.addEventListener('resize', onWindowResize);

            // Animation loop
            renderer.setAnimationLoop(animate);
        }

        function buildApartment() {
            roomGroup = new THREE.Group();

            // Floor (Wooden parquet tone)
            const floorGeo = new THREE.PlaneGeometry(10, 8);
            const floorMat = new THREE.MeshStandardNodeMaterial({ color: 0x92400e, roughness: 0.6 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            roomGroup.add(floor);

            // Back Wall
            const wallGeo = new THREE.PlaneGeometry(10, 5);
            const wallMat = new THREE.MeshStandardNodeMaterial({ color: 0x1e293b, roughness: 0.9 });
            const backWall = new THREE.Mesh(wallGeo, wallMat);
            backWall.position.set(0, 2.5, -4);
            roomGroup.add(backWall);

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-5, 2.5, 0);
            roomGroup.add(leftWall);

            // Iconic Couch (Jerry's Blue/Teal Couch)
            const couchGroup = new THREE.Group();
            const baseMat = new THREE.MeshStandardNodeMaterial({ color: 0x0284c7, roughness: 0.7 });
            
            // Couch Base
            const couchBase = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.6, 1.4), baseMat);
            couchBase.position.set(0, 0.3, 1.8);
            couchBase.castShadow = true;
            couchBase.receiveShadow = true;
            couchGroup.add(couchBase);

            // Couch Back
            const couchBack = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 0.4), baseMat);
            couchBack.position.set(0, 1.1, 2.4);
            couchBack.castShadow = true;
            couchGroup.add(couchBack);

            // Couch Cushions
            const cushionMat = new THREE.MeshStandardNodeMaterial({ color: 0x0369a1, roughness: 0.8 });
            const cushion = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.3, 1.2), cushionMat);
            cushion.position.set(0, 0.75, 1.8);
            couchGroup.add(cushion);
            roomGroup.add(couchGroup);

            // Kitchen Counter & Cabinets (Left side background)
            const kitchenMat = new THREE.MeshStandardNodeMaterial({ color: 0x78350f, roughness: 0.5 });
            const counter = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 3.5), kitchenMat);
            counter.position.set(-4.2, 0.5, -1.5);
            counter.castShadow = true;
            roomGroup.add(counter);

            // Bookshelf / Desk area
            const deskMat = new THREE.MeshStandardNodeMaterial({ color: 0x451a03, roughness: 0.4 });
            const desk = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9, 2.2), deskMat);
            desk.position.set(4.0, 0.45, -2.5);
            roomGroup.add(desk);

            // Apartment Door (Entrance)
            const doorMat = new THREE.MeshStandardNodeMaterial({ color: 0x292524, roughness: 0.3 });
            const door = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.2, 0.2), doorMat);
            door.position.set(4.9, 1.6, 1.5);
            roomGroup.add(door);

            scene.add(roomGroup);
        }

        function buildCharacters() {
            Object.keys(characters).forEach(key => {
                const charData = characters[key];
                const charGroup = new THREE.Group();
                charGroup.position.set(charData.position.x, 0, charData.position.z);

                // Body (Low poly blocky style)
                const bodyMat = new THREE.MeshStandardNodeMaterial({ color: charData.color, roughness: 0.5 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.1, 0.4), bodyMat);
                body.position.y = 0.85;
                body.castShadow = true;
                charGroup.add(body);

                // Head
                const headMat = new THREE.MeshStandardNodeMaterial({ color: 0xfde047, roughness: 0.6 }); // skin tone
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
                head.position.y = 1.6;
                head.castShadow = true;
                charGroup.add(head);
                characterHeads[key] = head;

                // Hair / Hat details per character
                if (key === 'kramer') {
                    // Kramer wild hair
                    const hairMat = new THREE.MeshStandardNodeMaterial({ color: 0x1c1917 });
                    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.5), hairMat);
                    hair.position.set(0, 1.85, 0);
                    charGroup.add(hair);
                } else if (key === 'elaine') {
                    // Elaine tall hair
                    const hairMat = new THREE.MeshStandardNodeMaterial({ color: 0x78350f });
                    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.45), hairMat);
                    hair.position.set(0, 1.9, 0);
                    charGroup.add(hair);
                }

                scene.add(charGroup);
                characterMeshes[key] = charGroup;
            });
        }

        function switchCamera(mode) {
            currentCamMode = mode;
            ['wide', 'couch', 'kitchen'].forEach(m => {
                const btn = document.getElementById(`cam-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-bold transition";
                } else {
                    btn.className = "px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition";
                }
            });
            updateCameraPosition(mode);
        }

        function updateCameraPosition(mode) {
            if (mode === 'wide') {
                camera.position.set(0, 3.2, 6.5);
                camera.lookAt(0, 1.2, 0);
            } else if (mode === 'couch') {
                camera.position.set(-0.5, 1.8, 2.8);
                camera.lookAt(0, 1.4, -2.0);
            } else if (mode === 'kitchen') {
                camera.position.set(-2.5, 2.5, -0.5);
                camera.lookAt(1.0, 1.0, 0);
            }
        }

        let clock = new THREE.Clock();
        function animate() {

            const elapsedTime = clock.getElapsedTime();

            // Subtle idle bobbing animation for characters
            Object.keys(characterMeshes).forEach((key, index) => {
                const mesh = characterMeshes[key];
                mesh.position.y = Math.sin(elapsedTime * 2 + index) * 0.04;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Script & Conversation Management
        function escapeText(value) { const el = document.createElement('span'); el.textContent = value; return el.innerHTML; }
        function renderScriptFeed() {
            const feed = document.getElementById('script-feed');
            feed.innerHTML = '';

            scriptHistory.forEach((item, index) => {
                const char = characters[item.character] || characters.jerry;
                const isCurrent = index === currentScriptIndex;

                const div = document.createElement('div');
                div.tabIndex = 0;
                div.setAttribute('role', 'button');
                div.setAttribute('aria-label', `Play beat ${index + 1}, ${char.name}`);
                div.onclick = () => { currentScriptIndex = index; renderScriptFeed(); };
                div.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); div.click(); } };
                div.className = `p-3 rounded-xl border transition-all ${isCurrent ? 'bg-slate-900 border-amber-500/60 shadow-lg scale-[1.01]' : 'bg-slate-900/40 border-slate-800/80 opacity-70'}`;
                
                div.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-xs uppercase tracking-wider" style="color: #${char.color.toString(16)}">${char.name}</span>
                        <span class="text-[10px] text-slate-500">Beat #${index + 1}</span>
                    </div>
                    <p class="text-slate-200 text-sm leading-relaxed">${escapeText(item.text)}</p>
                `;
                feed.appendChild(div);
            });

            // Scroll to active item
            const activeEl = feed.children[currentScriptIndex];
            if (activeEl) {
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            updateActiveSpeakerBanner();
        }

        function updateActiveSpeakerBanner() {
            const currentItem = scriptHistory[currentScriptIndex];
            if (!currentItem) return;
            const char = characters[currentItem.character] || characters.jerry;

            document.getElementById('speaker-name').innerText = char.name;
            document.getElementById('speaker-name').style.color = `#${char.color.toString(16)}`;
            document.getElementById('speaker-line').innerText = `"${currentItem.text}"`;

            // Turn character head towards center / camera slightly
            Object.keys(characterHeads).forEach(key => {
                if (key === currentItem.character) {
                    characterHeads[key].rotation.y = 0.3;
                } else {
                    characterHeads[key].rotation.y = 0;
                }
            });

            if (audioEnabled) {
                playSlapBassNote();
            }
        }

        function generateNextBeat() {
            if (scriptHistory.length === 0) return;
            
            // Dynamic Seinfeld dialogue generator based on topics and previous lines
            const lastItem = scriptHistory[scriptHistory.length - 1];
            const nextCharKey = getNextCharacter(lastItem.character);
            
            // Generate contextual generative dialogue
            const generatedLines = [
                `You see, that's what I'm talking about! It's a complete sociological phenomenon!`,
                `I can't deal with it. My brain simply refuses to process that level of awkwardness.`,
                `Who are these people? Where do they come from? They walk among us!`,
                `You're making a big deal out of nothing. It's totally normal behavior!`,
                `Normal?! There is nothing normal about wearing socks with sandals in public!`,
                `(Snorts) Trust me, if you lived through what I lived through, you'd be locking your doors too.`
            ];

            const randomLine = generatedLines[Math.floor(Math.random() * generatedLines.length)];
            
            scriptHistory.push({
                character: nextCharKey,
                text: randomLine
            });

            currentScriptIndex = scriptHistory.length - 1;
            renderScriptFeed();
        }

        function getNextCharacter(currentKey) {
            const keys = Object.keys(characters);
            const currentIndex = keys.indexOf(currentKey);
            const nextIndex = (currentIndex + 1) % keys.length;
            return keys[nextIndex];
        }

        function sendDirectorPrompt() {
            const input = document.getElementById('user-prompt');
            const promptText = input.value.trim();
            if (!promptText) return;

            // Add user direction to script feed as scene marker
            scriptHistory.push({
                character: 'jerry',
                text: `[DIRECTOR NOTE: ${promptText}] -> Alright, let's look at this situation. What's going on here?`
            });

            // Follow up with character reaction
            const followupChars = ['george', 'elaine', 'kramer'];
            const randomChar = followupChars[Math.floor(Math.random() * followupChars.length)];
            
            scriptHistory.push({
                character: randomChar,
                text: `If you think ${promptText.toLowerCase()} is bad, you should see what happened to me this morning at the deli!`
            });

            currentScriptIndex = scriptHistory.length - 1;
            input.value = '';
            renderScriptFeed();
        }

        function setPromptAndSend(text) {
            document.getElementById('user-prompt').value = text;
            sendDirectorPrompt();
        }

        function clearScript() {
            scriptHistory = [
                { character: 'jerry', text: "New scene initialized. Let's talk about something trivial." }
            ];
            currentScriptIndex = 0;
            renderScriptFeed();
        }

        function autoPlayToggle() {
            isAutoPlaying = !isAutoPlaying;
            const btnLabel = document.getElementById('autoplay-label');
            const icon = document.getElementById('autoplay-icon');

            if (isAutoPlaying) {
                btnLabel.innerText = "Pause Auto";
                icon.innerText = "⏸";
                autoPlayTimer = setInterval(() => {
                    if (currentScriptIndex < scriptHistory.length - 1) {
                        currentScriptIndex++;
                        renderScriptFeed();
                    } else {
                        generateNextBeat();
                    }
                }, 4000);
            } else {
                btnLabel.innerText = "Auto-Play";
                icon.innerText = "▶";
                clearInterval(autoPlayTimer);
            }
        }

        // Simulated Slap Bass Audio Generator (Web Audio API)
        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const label = document.getElementById('audio-label');
            const btn = document.getElementById('audio-btn');

            if (audioEnabled) {
                label.innerText = "Slap Bass: On";
                btn.className = "bg-amber-500/20 text-amber-300 p-2 rounded-lg border border-amber-500 text-xs flex items-center space-x-1.5 transition";
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } else {
                label.innerText = "Slap Bass: Off";
                btn.className = "bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-lg border border-slate-700 text-xs flex items-center space-x-1.5 transition";
            }
        }

        function playSlapBassNote() {
            if (!audioCtx || !audioEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                // Funky bass frequencies
                const freqs = [110, 123.47, 146.83, 164.81, 196.0];
                osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                // Ignore audio context autoplay policy restrictions until user interaction
            }
        }

        // Initialize on window load
        Object.assign(window, {switchCamera, toggleAudio, clearScript, sendDirectorPrompt, generateNextBeat, autoPlayToggle, setPromptAndSend});
        document.getElementById('user-prompt').addEventListener('keydown', e => { if(e.key === 'Enter') sendDirectorPrompt(); });
        renderScriptFeed();
        init3D().catch(error => {
            const notice = document.createElement('div');
            notice.className = 'p-8 text-amber-200';
            notice.textContent = error.message + ' The script studio remains available.';
            document.getElementById('canvas-container').replaceChildren(notice);
        });
    </script>
</body>
