<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8</head>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debug Event Sessions</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        background: #0f1115;
        color: #e8eaee;
      }

      .layout {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: #c5cad3;
      }

      input,
      button {
        border: 1px solid #313949;
        border-radius: 6px;
        padding: 8px 10px;
        background: #0f131a;
        color: #e8eaee;
        font-size: 14px;
      }

      button {
        border: none;
        background: #2563eb;
        cursor: pointer;
      }

      .muted {
        opacity: 0.8;
        font-size: 13px;
      }

      .panel {
        margin-top: 14px;
        border: 1px solid #2d3440;
        border-radius: 8px;
        background: #171b22;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        text-align: left;
        border-bottom: 1px solid #2b323d;
        padding: 10px;
      }

      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <h1>Saved Debug Sessions</h1>
      <p class="muted">Lists files created by <code>POST /api/debug/events</code>. Open any file directly in the timeline viewer.</p>

      <div class="toolbar">
        <label>
          Max files
          <input id="limit" type="number" min="1" max="1000" value="200" />
        </label>
        <button id="refresh">Refresh</button>
        <a href="/tools/timeline-viewer.html">Open timeline viewer</a>
      </div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Event file</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <script type="module">
      const rows = document.getElementById('rows');
      const refreshButton = document.getElementById('refresh');
      const limitInput = document.getElementById('limit');

      const esc = (value) =>
        String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');

      async function loadSessions() {
        rows.innerHTML = '<tr><td colspan="3">Loading…</td></tr>';

        const limit = Number(limitInput.value) || 200;

        try {
          const response = await fetch(`/api/debug/events?limit=${Math.max(1, Math.min(limit, 1000))}`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const payload = await response.json();
          const files = Array.isArray(payload.files) ? payload.files : [];

          if (files.length === 0) {
            rows.innerHTML = '<tr><td colspan="3">No saved sessions yet.</td></tr>';
            return;
          }

          rows.innerHTML = files.map((file, index) => {
            const path = file.path;
            const timelineUrl = `/tools/timeline-viewer.html?eventsUrl=${encodeURIComponent(path)}`;

            return `
              <tr>
                <td>${index + 1}</td>
                <td><a href="${esc(path)}" target="_blank" rel="noreferrer">${esc(path)}</a></td>
                <td><a href="${timelineUrl}">Open in timeline viewer</a></td>
              </tr>
            `;
          }).join('');
        } catch (error) {
          rows.innerHTML = `<tr><td colspan="3">Unable to load sessions: ${esc(error.message)}</td></tr>`;
        }
      }

      refreshButton.addEventListener('click', loadSessions);
      loadSessions();
    </script>
  </body>
</html>
