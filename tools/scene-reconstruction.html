!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk Scene - Three.js</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
    }

    .info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      color: white;
      background: rgba(0,0,0,0.55);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      border-radius: 8px;
      user-select: none;
    }
  </style>
</head>

<body>
  <div class="info">
    Drag: orbit &nbsp; • &nbsp; Wheel: zoom &nbsp; • &nbsp; Right-drag: pan
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171717);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.01,
      100
    );

    camera.position.set(2.8, -3.4, 2.3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0.65);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;

    // Soft ambient fill.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x3b2e24, 1.4));

    // Main light from front-left.
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(-3, -4, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    scene.add(keyLight);

    // Slight warm side light.
    const warmLight = new THREE.PointLight(0xffc38a, 18, 8);
    warmLight.position.set(-1.6, 1.4, 2.0);
    scene.add(warmLight);

    // Floor.
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 10),
      new THREE.MeshStandardMaterial({
        color: 0x5a4332,
        roughness: 0.9,
        metalness: 0.0
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.z = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    // A simple wall/background plane.
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 5),
      new THREE.MeshStandardMaterial({
        color: 0xb7ad9d,
        roughness: 1.0
      })
    );
    wall.position.set(0, 2.5, 2.2);
    wall.rotation.x = Math.PI / 2;
    wall.receiveShadow = true;
    scene.add(wall);

    // Load MTL, then OBJ.
    const mtlLoader = new MTLLoader();
    mtlLoader.load(
      './simplified_desk_with_monitor.mtl',
      (materials) => {
        materials.preload();

        const objLoader = new OBJLoader();
        objLoader.setMaterials(materials);

        objLoader.load(
          './simplified_desk_with_monitor.obj',
          (desk) => {
            desk.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;

                // Improve the simple MTL materials.
                if (child.material) {
                  child.material.side = THREE.DoubleSide;
                }
              }
            });

            scene.add(desk);

            // Frame the model automatically.
            const box = new THREE.Box3().setFromObject(desk);
            const center = box.getCenter(new THREE.Vector3());
            controls.target.copy(center);
            controls.target.z *= 0.8;
            controls.update();
          },
          undefined,
          (error) => {
            console.error('Could not load OBJ:', error);
          }
        );
      },
      undefined,
      (error) => {
        console.error('Could not load MTL:', error);
      }
    );

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
